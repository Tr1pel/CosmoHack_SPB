services:
  app:
    build: .
    # Back up after a crash or a server reboot; tini forwards stop signals to Node.
    restart: unless-stopped
    init: true
    # Loopback by default: Docker bypasses ufw, and nginx publishes the site anyway.
    # BIND_ADDRESS=0.0.0.0 in .env opens the port to the network without a proxy.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-5173}:5173"
    environment:
      HOST: 0.0.0.0
      PORT: 5173
      PIPELINE_PYTHON: /opt/venv/bin/python
      PIPELINE_CACHE: /app/local/pipeline
      SPACEPY: /app/local/spacepy
    volumes:
      - ./local:/app/local

  space-track:
    build: .
    profiles: ["archive"]
    environment:
      SPACE_TRACK_IDENTITY: ${SPACE_TRACK_IDENTITY:-}
      SPACE_TRACK_PASSWORD: ${SPACE_TRACK_PASSWORD:-}
    entrypoint: ["node", "scripts/fetch-spacetrack.mjs"]
    volumes:
      - ./local:/app/local
